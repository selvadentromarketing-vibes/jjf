[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Language routing: every unprefixed path is sent to /es/ or /en/ by Accept-Language, then geo (plan §9).
[[edge_functions]]
  path = "/*"
  function = "locale"
  excludedPath = ["/es/*", "/en/*", "/_astro/*", "/media/*", "/og/*", "/favicon.svg", "/robots.txt", "/sitemap-index.xml", "/sitemap-0.xml", "/404.html", "/.netlify/*"]

# Deploy previews and branch deploys are never indexed.
[[edge_functions]]
  path = "/*"
  function = "noindex-preview"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Vary = "Accept-Language"
